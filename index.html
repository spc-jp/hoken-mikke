<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保険みっけ｜お客様の困りごとから、伝わる説明をみつける</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@700&display=swap');

  :root {
    --navy: #223670;
    --navy-dark: #172550;
    --navy-light: #2d4a94;
    --gold: #D0A900;
    --gold-light: #f0c800;
    --gold-pale: #fff8d6;
    --white: #ffffff;
    --gray-100: #f8f9fc;
    --gray-200: #eef0f6;
    --gray-400: #9099b2;
    --gray-700: #3d4460;
    --text: #1a2040;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(34,54,112,0.12);
    --shadow-lg: 0 8px 40px rgba(34,54,112,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: #f0f3fa;
    color: var(--text);
    min-height: 100vh;
  }

  /* ヘッダー */
  .header {
    background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 60%, var(--navy-light) 100%);
    padding: 28px 20px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 180px; height: 180px;
    background: rgba(208,169,0,0.15);
    border-radius: 50%;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -30px; left: -30px;
    width: 120px; height: 120px;
    background: rgba(208,169,0,0.1);
    border-radius: 50%;
  }
  .header-badge {
    display: inline-block;
    background: var(--gold);
    color: var(--navy-dark);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 28px;
    color: var(--white);
    margin-bottom: 6px;
    position: relative;
    z-index: 1;
  }
  .header h1 span {
    color: var(--gold);
  }
  .header p {
    font-size: 12px;
    color: rgba(255,255,255,0.75);
    position: relative;
    z-index: 1;
  }

  /* ステップインジケーター */
  .steps-bar {
    background: var(--white);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    box-shadow: 0 2px 8px rgba(34,54,112,0.08);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .step-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .step-num {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--gray-200);
    color: var(--gray-400);
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  .step-label {
    font-size: 11px;
    color: var(--gray-400);
    font-weight: 500;
    transition: all 0.3s;
  }
  .step-line {
    width: 24px;
    height: 2px;
    background: var(--gray-200);
    margin: 0 4px;
    transition: all 0.3s;
  }
  .step-item.active .step-num {
    background: var(--navy);
    color: var(--white);
  }
  .step-item.active .step-label {
    color: var(--navy);
    font-weight: 700;
  }
  .step-item.done .step-num {
    background: var(--gold);
    color: var(--navy-dark);
  }
  .step-item.done .step-label {
    color: var(--gold);
  }
  .step-line.done {
    background: var(--gold);
  }

  /* メインコンテンツ */
  .main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  /* セクション */
  .section {
    display: none;
    animation: fadeUp 0.4s ease;
  }
  .section.active {
    display: block;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 16px;
    padding-left: 10px;
    border-left: 3px solid var(--gold);
  }

  /* 属性カード */
  .attr-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 8px;
  }
  .attr-card {
    background: var(--white);
    border: 2px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 20px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: var(--shadow);
  }
  .attr-card:hover {
    border-color: var(--navy-light);
    transform: translateY(-2px);
  }
  .attr-card.selected {
    border-color: var(--navy);
    background: var(--navy);
  }
  .attr-icon {
    font-size: 28px;
    margin-bottom: 8px;
    display: block;
  }
  .attr-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1.4;
  }
  .attr-card.selected .attr-label {
    color: var(--white);
  }
  .attr-sub {
    font-size: 10px;
    color: var(--gray-400);
    margin-top: 4px;
  }
  .attr-card.selected .attr-sub {
    color: rgba(255,255,255,0.7);
  }

  /* 困りごとカード */
  .concern-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .concern-card {
    background: var(--white);
    border: 2px solid var(--gray-200);
    border-radius: 10px;
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(34,54,112,0.06);
  }
  .concern-card:hover {
    border-color: var(--navy-light);
  }
  .concern-card.selected {
    border-color: var(--gold);
    background: var(--gold-pale);
  }
  .concern-check {
    width: 18px; height: 18px;
    border: 2px solid var(--gray-200);
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .concern-card.selected .concern-check {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--navy-dark);
    font-size: 11px;
  }
  .concern-icon {
    font-size: 18px;
    flex-shrink: 0;
  }
  .concern-text {
    font-size: 12px;
    font-weight: 500;
    color: var(--gray-700);
    line-height: 1.5;
  }
  .concern-card.selected .concern-text {
    color: var(--navy);
    font-weight: 700;
  }

  /* ボタン */
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: var(--radius);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    color: var(--white);
    box-shadow: 0 4px 16px rgba(34,54,112,0.3);
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(34,54,112,0.4);
  }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }
  .btn-gold {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
    color: var(--navy-dark);
    box-shadow: 0 4px 16px rgba(208,169,0,0.3);
    margin-top: 12px;
  }
  .btn-gold:hover {
    transform: translateY(-1px);
  }
  .btn-back {
    background: var(--gray-200);
    color: var(--gray-700);
    margin-bottom: 12px;
    font-size: 13px;
  }
  .btn-back:hover {
    background: var(--gray-400);
    color: var(--white);
  }

  /* 結果エリア */
  .result-header {
    background: linear-gradient(135deg, var(--navy-dark), var(--navy));
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
    color: var(--white);
  }
  .result-header-label {
    font-size: 10px;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
  }
  .result-header-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.5;
  }
  .result-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }
  .result-tag {
    background: rgba(208,169,0,0.25);
    color: var(--gold-light);
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 700;
  }

  .result-block {
    background: var(--white);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--navy);
  }
  .result-block.gold {
    border-left-color: var(--gold);
  }
  .result-block.warn {
    border-left-color: #e05a5a;
  }
  .result-block-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .result-block.gold .result-block-title {
    color: #8a6f00;
  }
  .result-block.warn .result-block-title {
    color: #c0392b;
  }
  .result-item {
    font-size: 13px;
    color: var(--gray-700);
    line-height: 1.7;
    padding: 6px 0;
    border-bottom: 1px solid var(--gray-200);
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .result-item:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }
  .result-item-dot {
    color: var(--navy);
    font-size: 16px;
    line-height: 1.5;
    flex-shrink: 0;
  }
  .result-block.gold .result-item-dot {
    color: var(--gold);
  }
  .result-block.warn .result-item-dot {
    color: #e05a5a;
  }

  .copy-area {
    background: var(--gray-100);
    border: 1px dashed var(--gray-400);
    border-radius: 10px;
    padding: 16px;
    margin-top: 16px;
    font-size: 12px;
    color: var(--gray-700);
    white-space: pre-wrap;
    line-height: 1.8;
    display: none;
  }
  .copy-area.show {
    display: block;
  }

  .hint {
    font-size: 11px;
    color: var(--gray-400);
    text-align: center;
    margin-top: 8px;
  }

  /* フッター */
  .footer {
    text-align: center;
    padding: 20px;
    font-size: 11px;
    color: var(--gray-400);
  }
  .footer span {
    color: var(--navy);
    font-weight: 700;
  }

  /* スクロール */
  html { scroll-behavior: smooth; }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">士業・保険代理店向けツール</div>
  <h1>保険<span>みっけ</span></h1>
  <p>お客様の困りごとから、伝わる説明をみつける</p>
</div>

<div class="steps-bar" id="stepsBar">
  <div class="step-item active" id="step1Ind">
    <div class="step-num">1</div>
    <div class="step-label">属性</div>
  </div>
  <div class="step-line" id="line1"></div>
  <div class="step-item" id="step2Ind">
    <div class="step-num">2</div>
    <div class="step-label">困りごと</div>
  </div>
  <div class="step-line" id="line2"></div>
  <div class="step-item" id="step3Ind">
    <div class="step-num">3</div>
    <div class="step-label">説明サポート</div>
  </div>
</div>

<div class="main">

  <!-- STEP1: 属性選択 -->
  <div class="section active" id="step1">
    <div class="section-title">お客様の属性を選んでください</div>
    <div class="attr-grid">
      <div class="attr-card" onclick="selectAttr('corporate', this)">
        <span class="attr-icon">🏢</span>
        <div class="attr-label">法人</div>
        <div class="attr-sub">中小企業・会社</div>
      </div>
      <div class="attr-card" onclick="selectAttr('personal', this)">
        <span class="attr-icon">👤</span>
        <div class="attr-label">個人</div>
        <div class="attr-sub">会社員・家族</div>
      </div>
      <div class="attr-card" onclick="selectAttr('sole', this)">
        <span class="attr-icon">💼</span>
        <div class="attr-label">個人事業主</div>
        <div class="attr-sub">フリーランス</div>
      </div>
    </div>
    <p class="hint" style="margin-top:12px;">タップして選んでください</p>
  </div>

  <!-- STEP2: 困りごと選択 -->
  <div class="section" id="step2">
    <button class="btn btn-back" onclick="goStep(1)">← 属性を選び直す</button>
    <div class="section-title" id="concernTitle">困りごとを選んでください（複数選択OK）</div>
    <div class="concern-grid" id="concernGrid"></div>
    <button class="btn btn-primary" id="btnToResult" onclick="showResult()" disabled>説明サポート文を生成する →</button>
    <p class="hint" style="margin-top:8px;">1つ以上選ぶと進めます</p>
  </div>

  <!-- STEP3: 結果 -->
  <div class="section" id="step3">
    <button class="btn btn-back" onclick="goStep(2)">← 困りごとを選び直す</button>
    <div id="resultContent"></div>
    <button class="btn btn-gold" onclick="toggleCopy()">📋 トークメモをコピー用テキストで表示</button>
    <div class="copy-area" id="copyArea"></div>
    <button class="btn btn-primary" onclick="goStep(1)" style="margin-top:12px;">🔄 別のお客様で使う</button>
  </div>

</div>

<div class="footer">
  Powered by <span>Smile Plus Consulting</span>｜保険みっけ β版
</div>

// 状態管理
let currentAttr = null;
let selectedConcerns = [];

function selectAttr(attr, el) {
  document.querySelectorAll('.attr-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  currentAttr = attr;
  setTimeout(() => goStep(2), 300);
}

function renderConcerns() {
  const grid = document.getElementById('concernGrid');
  grid.innerHTML = '';
  selectedConcerns = [];
  const list = concerns[currentAttr] || [];
  list.forEach(c => {
    const div = document.createElement('div');
    div.className = 'concern-card';
    div.onclick = () => toggleConcern(c.id, div);
    div.innerHTML = `
      <div class="concern-check" id="chk-${c.id}"></div>
      <div class="concern-icon">${c.icon}</div>
      <div class="concern-text">${c.text}</div>
    `;
    grid.appendChild(div);
  });
  document.getElementById('btnToResult').disabled = true;
}

function toggleConcern(id, el) {
  const idx = selectedConcerns.indexOf(id);
  const chk = document.getElementById('chk-' + id);
  if (idx === -1) {
    selectedConcerns.push(id);
    el.classList.add('selected');
    chk.textContent = '✓';
  } else {
    selectedConcerns.splice(idx, 1);
    el.classList.remove('selected');
    chk.textContent = '';
  }
  document.getElementById('btnToResult').disabled = selectedConcerns.length === 0;
}

function showResult() {
  goStep(3);
  const container = document.getElementById('resultContent');
  container.innerHTML = '';

  // ヘッダー
  const attrNames = { corporate: '法人（中小企業）', personal: '個人', sole: '個人事業主' };
  const tags = selectedConcerns.map(id => results[id]?.label || id).filter(Boolean);
  
  const header = document.createElement('div');
  header.className = 'result-header';
  header.innerHTML = `
    <div class="result-header-label">説明サポートレポート</div>
    <div class="result-header-title">【${attrNames[currentAttr]}】のお客様への保険提案ポイント</div>
    <div class="result-tags">${tags.map(t => `<span class="result-tag">${t}</span>`).join('')}</div>
  `;
  container.appendChild(header);

  selectedConcerns.forEach(id => {
    const r = results[id];
    if (!r) return;

    const label = r.label;

    // トーク例
    const b1 = document.createElement('div');
    b1.className = 'result-block';
    b1.innerHTML = `
      <div class="result-block-title">💬 ${label}｜トークのきっかけ</div>
      <div class="result-item"><span class="result-item-dot">›</span><span>${r.talk}</span></div>
    `;
    container.appendChild(b1);

    // 関連保険
    const b2 = document.createElement('div');
    b2.className = 'result-block gold';
    b2.innerHTML = `
      <div class="result-block-title">📋 関連する保険の種類</div>
      ${r.types.map(t => `<div class="result-item"><span class="result-item-dot">›</span><span>${t}</span></div>`).join('')}
    `;
    container.appendChild(b2);

    // チェックポイント
    const b3 = document.createElement('div');
    b3.className = 'result-block';
    b3.innerHTML = `
      <div class="result-block-title">✅ 提案時のチェックポイント</div>
      ${r.points.map(p => `<div class="result-item"><span class="result-item-dot">›</span><span>${p}</span></div>`).join('')}
    `;
    container.appendChild(b3);

    // NGポイント
    const b4 = document.createElement('div');
    b4.className = 'result-block warn';
    b4.innerHTML = `
      <div class="result-block-title">⚠️ 注意・NGポイント</div>
      ${r.ng.map(n => `<div class="result-item"><span class="result-item-dot">›</span><span>${n}</span></div>`).join('')}
    `;
    container.appendChild(b4);

    // 次回確認
    const b5 = document.createElement('div');
    b5.className = 'result-block gold';
    b5.innerHTML = `
      <div class="result-block-title">🗒 次回面談で確認すること</div>
      ${r.next.map(n => `<div class="result-item"><span class="result-item-dot">›</span><span>${n}</span></div>`).join('')}
    `;
    container.appendChild(b5);
  });

  // コピー用テキスト生成
  const attrNames2 = { corporate: '法人（中小企業）', personal: '個人', sole: '個人事業主' };
  let copyText = `【保険みっけ 説明サポートメモ】\n`;
  copyText += `対象：${attrNames2[currentAttr]}\n`;
  copyText += `─────────────────\n\n`;
  selectedConcerns.forEach(id => {
    const r = results[id];
    if (!r) return;
    copyText += `■ ${r.label}\n`;
    copyText += `▶ トーク例\n${r.talk}\n\n`;
    copyText += `▶ 関連保険\n${r.types.map(t => '・' + t).join('\n')}\n\n`;
    copyText += `▶ チェックポイント\n${r.points.map(p => '・' + p).join('\n')}\n\n`;
    copyText += `▶ 注意・NGポイント\n${r.ng.map(n => '・' + n).join('\n')}\n\n`;
    copyText += `▶ 次回確認事項\n${r.next.map(n => '・' + n).join('\n')}\n\n`;
    copyText += `─────────────────\n\n`;
  });
  copyText += `Powered by 保険みっけ｜Smile Plus Consulting`;
  document.getElementById('copyArea').textContent = copyText;
}

function toggleCopy() {
  const area = document.getElementById('copyArea');
  const isShow = area.classList.contains('show');
  area.classList.toggle('show');
  if (!isShow) {
    // コピー実行
    if (navigator.clipboard) {
      navigator.clipboard.writeText(area.textContent).then(() => {
        alert('📋 トークメモをクリップボードにコピーしました！');
      });
    }
    area.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function goStep(n) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');

  // ステップインジケーター更新
  [1,2,3].forEach(i => {
    const el = document.getElementById('step' + i + 'Ind');
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  });
  [1,2].forEach(i => {
    const line = document.getElementById('line' + i);
    line.classList.remove('done');
    if (i < n) line.classList.add('done');
  });

  if (n === 2) renderConcerns();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
</body>
</html>
